<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <!-- 11장(반응형·PWA)의 출발점: 모바일 화면 폭을 기기 폭에 맞춘다 -->
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>업무 관리</title>
  <!-- 11장 Manifest·Service Worker 등록을 위해 모든 경로는 상대 경로(./)로 둔다 -->
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <header class="app-header">
    <h1>업무 관리</h1>
    <p class="notice">이 기기의 이 브라우저에만 저장됩니다. 실제 개인정보는 입력하지 마십시오.</p>
  </header>

  <main class="layout">
    <section class="panel" aria-labelledby="form-title">
      <h2 id="form-title">업무 등록</h2>
      <form id="task-form" novalidate>
        <label for="title">업무명 *</label>
        <input id="title" maxlength="100" required autocomplete="off">

        <div class="row">
          <div>
            <label for="status">상태</label>
            <select id="status">
              <option>예정</option><option>진행 중</option><option>완료</option>
            </select>
          </div>
          <div>
            <label for="priority">우선순위</label>
            <select id="priority">
              <option>높음</option><option selected>보통</option><option>낮음</option>
            </select>
          </div>
        </div>

        <label for="due-date">마감일</label>
        <input type="date" id="due-date">

        <label for="memo">메모</label>
        <textarea id="memo" maxlength="500" rows="3"></textarea>

        <div class="actions">
          <button type="submit" id="submit-button" class="primary">등록</button>
          <button type="button" id="cancel-edit" hidden>수정 취소</button>
        </div>
        <p id="form-message" role="status" aria-live="polite"></p>
      </form>
    </section>

    <section class="panel" aria-labelledby="list-title">
      <h2 id="list-title">업무 목록</h2>
      <div class="filters" role="search" aria-label="업무 필터">
        <label class="sr-only" for="keyword">검색어</label>
        <input id="keyword" type="search" placeholder="업무명 또는 메모 검색">
        <label class="sr-only" for="filter-status">상태 필터</label>
        <select id="filter-status">
          <option value="전체">상태 전체</option><option value="예정">예정</option>
          <option value="진행 중">진행 중</option><option value="완료">완료</option>
        </select>
        <label class="sr-only" for="filter-priority">우선순위 필터</label>
        <select id="filter-priority">
          <option value="전체">우선순위 전체</option><option value="높음">높음</option>
          <option value="보통">보통</option><option value="낮음">낮음</option>
        </select>
        <label class="sr-only" for="filter-date">마감일 필터</label>
        <select id="filter-date">
          <option value="전체">날짜 전체</option><option value="오늘">오늘 마감</option>
          <option value="지연">기한 지남</option><option value="없음">마감일 없음</option>
        </select>
        <button type="button" id="reset-filters">필터 초기화</button>
      </div>
      <p id="result-count" aria-live="polite"></p>
      <ul id="task-list" class="task-list" aria-label="업무 목록"></ul>

      <div class="backup">
        <button type="button" id="export-button">JSON 백업 내보내기</button>
        <label for="import-file" class="file-label">JSON 백업 가져오기</label>
        <input type="file" id="import-file" accept="application/json,.json">
      </div>
    </section>
  </main>

  <script src="./app.js"></script>
</body>
</html>
